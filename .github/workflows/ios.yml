# Builds the iOS app on GitHub's macOS runners — no Mac needed.
#
# Every push that touches ios/ compiles the app (unsigned, for the simulator). The
# result is reported as annotations on the run: a summary of what was compiled plus
# any warnings, or the full list of compile errors. When the signing secrets below
# exist, pushes to main also archive a signed build and upload it to TestFlight.
#
# Repository variable (Settings → Secrets and variables → Actions → Variables):
#   IOS_BUNDLE_ID             e.g. com.yourname.cadence (your App ID)
# Repository secrets (… → Secrets):
#   IOS_TEAM_ID               10-character Apple Developer Team ID
#   IOS_DIST_CERT_P12         base64 of your "Apple Distribution" certificate (.p12)
#   IOS_DIST_CERT_PASSWORD    password of that .p12
#   IOS_PROFILE               base64 of the App Store provisioning profile (.mobileprovision)
#   ASC_KEY_ID                App Store Connect API key ID
#   ASC_ISSUER_ID             App Store Connect API issuer ID
#   ASC_KEY_P8                contents of the AuthKey_XXXX.p8 file
# See ios/README.md for how to get each of these from a Windows PC.
name: iOS

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  CADENCE_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.example.cadence' }}

jobs:
  build:
    name: Compile
    runs-on: macos-latest
    outputs:
      signing_ready: ${{ steps.signing.outputs.ready }}
    steps:
      - name: Check signing setup
        id: signing
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROFILE: ${{ secrets.IOS_PROFILE }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          for name in IOS_TEAM_ID IOS_DIST_CERT_P12 IOS_DIST_CERT_PASSWORD IOS_PROFILE ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::notice title=TestFlight upload skipped::Missing secrets:$missing (see ios/README.md)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen xcbeautify || brew upgrade xcodegen xcbeautify || true

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build for simulator (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Cadence.xcodeproj -scheme Cadence -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | xcbeautify --renderer github-actions

      - name: Report result
        if: always()
        working-directory: ios
        run: |
          # One annotation per category (GitHub caps how many a step may create);
          # newlines are encoded so a whole list fits in one message.
          annotate() {
            local body
            body=$(cat)
            # Unquoted replacements: macOS's bash 3.2 would keep the quotes literally.
            body="${body//%/%25}"
            body="${body//$'\r'/%0D}"
            body="${body//$'\n'/%0A}"
            echo "::$1 title=$2::$body"
          }
          [ -f build.log ] || exit 0
          xcode=$(xcodebuild -version | head -1)
          swift_files=$(grep -E '^SwiftCompile ' build.log | grep -oE '[A-Za-z0-9_+]+\.swift' | sort -u | wc -l | tr -d ' ')
          errors=$(grep -E ': (fatal )?error: ' build.log | sed -E 's#^.*/ios/##' | sort -u)
          warnings=$(grep -E ': warning: ' build.log | sed -E 's#^.*/ios/##' | sort -u)
          app="build/Build/Products/Debug-iphonesimulator/Cadence.app"
          size=$( [ -d "$app" ] && du -sh "$app" | cut -f1 || echo "not built")
          if [ -n "$errors" ]; then
            printf '%s\n' "$errors" | head -120 | annotate error "Compile errors ($(printf '%s\n' "$errors" | wc -l | tr -d ' '))"
          fi
          if [ -n "$warnings" ]; then
            printf '%s\n' "$warnings" | head -120 | annotate warning "Compiler warnings ($(printf '%s\n' "$warnings" | wc -l | tr -d ' '))"
          fi
          printf '%s\n' "$xcode" "Swift files compiled: $swift_files" "Cadence.app: $size" | annotate notice "Build report"
          {
            echo "## Build report"
            echo "- $xcode"
            echo "- Swift files compiled: $swift_files"
            echo "- Cadence.app: $size"
            if [ -n "$errors" ]; then
              echo '### Errors'; echo '```'; printf '%s\n' "$errors" | head -150; echo '```'
            fi
            if [ -n "$warnings" ]; then
              echo '### Warnings'; echo '```'; printf '%s\n' "$warnings" | head -150; echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ios/build.log

  testflight:
    name: TestFlight
    needs: build
    if: needs.build.outputs.signing_ready == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    env:
      CADENCE_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
      IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
      IOS_PROFILE: ${{ secrets.IOS_PROFILE }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen xcbeautify || brew upgrade xcodegen xcbeautify || true

      - name: Install certificate and provisioning profile
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$IOS_DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          PROFILE="$RUNNER_TEMP/cadence.mobileprovision"
          echo "$IOS_PROFILE" | base64 --decode > "$PROFILE"
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$PROFILE" "$dir/$UUID.mobileprovision"
          done
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Archive
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Cadence.xcodeproj -scheme Cadence -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Cadence.xcarchive" \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$CADENCE_TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive 2>&1 | tee archive.log | xcbeautify --renderer github-actions

      - name: Upload to TestFlight
        working-directory: ios
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY_PATH"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$CADENCE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>$CADENCE_BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Cadence.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee export.log
          echo "::notice title=Uploaded to TestFlight::Build ${{ github.run_number }} is processing in App Store Connect (usually 5–15 minutes)."

      - name: Report signing errors
        if: failure()
        working-directory: ios
        run: |
          body=$(cat archive.log export.log 2>/dev/null | grep -iE 'error|failed|invalid' | sort -u | head -60)
          body="${body//%/%25}"; body="${body//$'\n'/%0A}"
          [ -n "$body" ] && echo "::error title=Signing / upload errors::$body" || true

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
